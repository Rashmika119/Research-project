# All trainable task components start from scratch. No baseline initialization.
protocol: scratch_v1
dataset: FB15k-237
model:
  encoder_type: rgat
  scorer_type: complex
  dim: 32
  num_layers: 2
  heads: 1
  dropout: 0.2
baseline:
  epochs: 100
  lr: 0.001
  num_negatives: 4
  train_batch_size: 32768
  eval_every: 5
pilot:
  max_entities: 1000
  epochs: 30  # INCLUDES the five structural warmup epochs
  warmup_epochs: 5
  subset_seed: 0
  seeds: [0, 1, 2]
  variants: [original, residual, no-refinement, original-no-warmup, residual-no-softprompt]
  lr: 0.001
  train_batch_size: 0  # one full-subset optimizer step per epoch
  text_batch_size: 4
  max_text_length: 64
  eval_every: 1
final:
  enabled: false
  epochs: 100  # includes warmup when applicable; independent fresh model
  warmup_epochs: 5
  seed: 0
  train_batch_size: 0
  eval_every: 5
