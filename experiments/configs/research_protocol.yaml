# Current stage; previous protocol is preserved in research_protocol_1000_historical.yaml.
protocol: warmup_ablation_induced_v1
dataset: FB15k-237
available_architectures: [residual, residual-no-softprompt, no-refinement]
model:
  encoder_type: rgat
  scorer_type: complex
  dim: 32
  num_layers: 2
  heads: 1
  dropout: 0.2
  num_bases: null
study:
  max_entities: 5000
  subset_seed: 0
  selection_strategy: train_bfs_induced_v1
  configurations:
    - residual-warmup
    - residual-no-warmup
    - residual-no-softprompt-warmup
    - residual-no-softprompt-no-warmup
  seeds: [0, 1, 2]
  epochs: 30
  warmup_epochs: 5
  lr: 0.001
  weight_decay: 0.00001
  num_negatives: 4
  grad_clip: 1.0
  train_batch_size: 0  # exactly one optimizer step per epoch
  text_batch_size: 4
  max_text_length: 64
  eval_batch_size: 64
  eval_every: 1
  optimizer: Adam
  deterministic: true
  ranking_policy: average_exact_ties
baseline:
  epochs: 100
  lr: 0.001
  num_negatives: 4
  train_batch_size: 32768
  eval_every: 5
