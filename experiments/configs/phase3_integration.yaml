# Selected Phase 3 integration contract (2026-10-05).
# Run: python run_phase3_smoke_test.py
# This checks integration, not training. Historical Phase 1/2 configs stay unchanged.
seed: 0

dataset:
  raw_dir: data/raw/fb15k237
  download_if_missing: true
  use_synthetic_fallback: false

phase1:
  checkpoint_path: experiments/checkpoints/kg_only_baseline.pt
  # Legacy saves lack ID maps. Supply a verified sidecar for that original run
  # (checkpoint_sha256, entity2id, relation2id), or use a new save with maps.
  id_map_path: null
  # Input weights only. Do not overwrite them with an integration artifact.
  # Missing/incompatible weights must fail the checkpoint-backed gate rather
  # than silently substituting random initialization or a different encoder.

# Matches phase1_full.yaml; compatible with training.model_factory.
model:
  encoder_type: rgcn
  dim: &kg_dim 128
  num_layers: 2
  dropout: 0.2
  num_bases: 30

# Arguments for KGLMBridge; one KG dimension shared by encoder and bridge.
bridge:
  kg_dim: *kg_dim
  model_name: roberta-base
  projection_dropout: 0.1

text:
  max_length: 64
  text_dir: data/text/fb15k237

# Sample only training edges, and transfer weights by entity key to toy IDs.
toy_subset:
  max_entities: 50

# Small text batch for the integration gate, not a training batch size.
smoke_test:
  batch_size: 4

report_dir: experiments/logs/phase3
