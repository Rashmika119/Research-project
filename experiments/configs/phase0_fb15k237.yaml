# Phase 0 config: dataset acquisition + toy-subset generation for FB15k-237.
# FB15k-237 (Freebase-derived) is the project's primary dataset going
# forward, per explicit supervisor direction — see CLAUDE.md non-negotiable
# rule #6 for the WN18RR -> WN18 -> FB15k-237 decision history.
# See CLAUDE.md "Implementation Strategy" for what Phase 0 must prove before
# Phase 1 (KG-only baseline) begins.

dataset:
  name: fb15k237
  raw_dir: data/raw/fb15k237
  download_if_missing: true
  use_synthetic_fallback: true # only used if download fails (e.g. offline)

toy_subset:
  max_entities: 50
  seed: 0

seed: 0
