# Phase 0 config: dataset acquisition + toy-subset generation for WN18.
# WN18 (not WN18RR) is the project's primary dataset going forward, per
# explicit supervisor direction — see CLAUDE.md non-negotiable rule #6.
# See CLAUDE.md "Implementation Strategy" for what Phase 0 must prove before
# Phase 1 (KG-only baseline) begins.

dataset:
  name: wn18
  raw_dir: data/raw/wn18
  download_if_missing: true
  use_synthetic_fallback: true # only used if download fails (e.g. offline)

toy_subset:
  max_entities: 50
  seed: 0

seed: 0
